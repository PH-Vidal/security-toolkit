name: Discord Pipeline Alert

on:
  workflow_run:
    workflows: ["CI - DevSecOps Pipeline"]
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    name: Send Pipeline Notification to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Send sanitized Discord webhook alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO_NAME: ${{ github.repository }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              print("DISCORD_WEBHOOK_URL secret not configured; skipping alert.")
              raise SystemExit(0)

          conclusion = os.environ.get("CONCLUSION", "unknown")
          status_icon = "✅" if conclusion == "success" else "❌"
          commit_first_line = os.environ.get("COMMIT_MSG", "").splitlines()[0] if os.environ.get("COMMIT_MSG") else "N/A"

          content = (
              f"{status_icon} **DevSecOps Pipeline: {conclusion.upper()}**\n"
              f"📦 Repo: `{os.environ['REPO_NAME']}`\n"
              f"🌿 Branch: `{os.environ['BRANCH']}`\n"
              f"👤 Autor: `{os.environ['ACTOR']}`\n"
              f"📝 Commit: {commit_first_line[:120]}\n"
              f"🔗 Logs: {os.environ['RUN_URL']}"
          )

          payload = json.dumps({"content": content}).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "SecurityToolkit-CI/2.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              print(f"Discord alert sent (HTTP {resp.status}).")
          EOF
