name: CI - DevSecOps Pipeline

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint-and-sast:
    name: Lint (Ruff) & SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: python -m pip install --upgrade pip ruff bandit

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Bandit SAST
        run: bandit -r security_toolkit -ll -ii

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Run pytest with coverage
        run: pytest --cov=security_toolkit --cov-report=term-missing

  trivy-fs-scan:
    name: Secrets, Misconfig & Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

  docker-build-and-scan:
    name: Container Build, Smoke Test & Trivy Scan
    runs-on: ubuntu-latest
    needs: [lint-and-sast, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build hardened Docker image
        run: docker build -t security-toolkit:ci .

      - name: Verify non-root user and CLI smoke tests
        run: |
          docker run --rm --entrypoint id security-toolkit:ci -u | grep -qx "10001"
          docker run --rm security-toolkit:ci --version
          docker run --rm security-toolkit:ci log-analyze --file /app/samples/sample_auth.log --json

      - name: Run Trivy container image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: security-toolkit:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
