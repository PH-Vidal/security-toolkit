[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security-toolkit"
version = "2.0.0"
description = "Modular Python CLI for DevSecOps, Network Recon, Web/TLS Auditing, and Blue Team Log Analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Henrique Vidal" }]
keywords = ["cybersecurity", "devsecops", "blue-team", "mitre-attack", "security-cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit>=1.7.9",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
sec-toolkit = "security_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["security_toolkit*"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"security_toolkit/ping_sweep.py" = ["S404", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
